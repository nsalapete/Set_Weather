[project]
name = "set-weaver"
version = "0.1.0"
description = "Anthropic Claude agent orchestration for DJ set curation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.34.0",
    "pydantic>=2.7.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"
